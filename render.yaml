services:
  - type: web
    name: nigeria-minigrids-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nigeria-minigrids-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://nigeria-minigrids.vercel.app"]'
    healthCheckPath: /health

databases:
  - name: nigeria-minigrids-db
    plan: free
    databaseName: minigrid
    user: minigrid
