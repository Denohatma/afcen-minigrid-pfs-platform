services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minigrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minigrid_dev}
      POSTGRES_DB: minigrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigrid -d minigrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://minigrid:${POSTGRES_PASSWORD:-minigrid_dev}@db:5432/minigrid"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-minigrid-documents}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost","http://frontend:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/app/documents

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  documents:
